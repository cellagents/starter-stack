services:
  game:
    build:
      context: https://github.com/cellagents/cells-game.git
    image: cellagents/cells-game:local
    environment:
      ADMIN_PASS: ${ADMIN_PASS:-local-dev}
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

  mcp:
    build:
      context: https://github.com/cellagents/cells-mcp.git
    image: cellagents/cells-mcp:local
    environment:
      GAME_SERVER_URL: http://game:3000
      MCP_PORT: "4000"
      MCP_PATH: /mcp
    depends_on:
      - game
    ports:
      - "127.0.0.1:4000:4000"
    restart: unless-stopped

  thin-client:
    build:
      context: https://github.com/cellagents/thin-client.git
    image: cellagents/thin-client:local
    command: ["sh", "-c", "cp -r /app/dist/. /out/ && echo 'thin-client bundle ready'"]
    volumes:
      - thin-client-dist:/out
    restart: "no"

  harness:
    build:
      context: https://github.com/cellagents/harness.git
    image: cellagents/harness:local
    environment:
      HARNESS_PORT: "5000"
      MCP_URL: http://mcp:4000/mcp
      GAME_SERVER_PUBLIC_URL: http://127.0.0.1:3000
      HARNESS_THIN_CLIENT_DIST: /thin-client-dist
      LLM_BASE_URL: http://litellm:4000/v1
      LLM_API_KEY: ${LITELLM_PRESHARED_KEY:-sk-local}
      LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-claude-sonnet-4-6}
      LLM_MODELS: ${LLM_MODELS:-claude-haiku-4-5,claude-sonnet-4-6,claude-opus-4-7,gpt-4o-mini,gpt-4o}
    volumes:
      - thin-client-dist:/thin-client-dist:ro
    depends_on:
      mcp:
        condition: service_started
      thin-client:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:5000:5000"
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-master}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-sk-local-salt}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    command: ["--config", "/litellm/config.yaml", "--port", "4000"]
    volumes:
      - ./litellm/config.yaml:/litellm/config.yaml:ro
      - litellm-data:/data
    ports:
      - "127.0.0.1:4001:4000"
    restart: unless-stopped

volumes:
  litellm-data:
  thin-client-dist:
