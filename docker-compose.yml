services:
  game:
    build:
      context: https://github.com/cellagents/cells-game.git
    image: cellagents/cells-game:local
    environment:
      ADMIN_PASS: ${ADMIN_PASS:-local-dev}
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

  mcp:
    build:
      context: https://github.com/cellagents/cells-mcp.git
    image: cellagents/cells-mcp:local
    environment:
      GAME_SERVER_URL: http://game:3000
      MCP_PORT: "4000"
      MCP_PATH: /mcp
    depends_on:
      - game
    ports:
      - "127.0.0.1:4000:4000"
    restart: unless-stopped

  harness:
    build:
      context: https://github.com/cellagents/harness.git
    image: cellagents/harness:local
    environment:
      HARNESS_PORT: "5000"
      MCP_URL: http://mcp:4000/mcp
      GAME_SERVER_PUBLIC_URL: http://127.0.0.1:3000
      LLM_BASE_URL: http://litellm:4000/v1
      # LiteLLM accepts its master key as a valid bearer; use it directly
      # for local-dev. A production deploy should mint a virtual key.
      LLM_API_KEY: ${LITELLM_MASTER_KEY:-sk-local-master}
      LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-claude-sonnet-4-6}
      LLM_MODELS: ${LLM_MODELS:-claude-haiku-4-5,claude-sonnet-4-6,claude-opus-4-7,gpt-4o-mini,gpt-4o}
    depends_on:
      mcp:
        condition: service_started
      litellm:
        condition: service_started
    ports:
      - "127.0.0.1:5000:5000"
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-master}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-sk-local-salt}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # No DB in this stack, so the admin UI at /ui can only render
      # broken pages. 404 the whole surface.
      DISABLE_ADMIN_UI: "True"
    command: ["--config", "/litellm/config.yaml", "--port", "4000"]
    volumes:
      - ./litellm/config.yaml:/litellm/config.yaml:ro
      - litellm-data:/data
    ports:
      - "127.0.0.1:4001:4000"
    restart: unless-stopped

volumes:
  litellm-data:
